name: Build APK

# Produces an installable APK without any local toolchain.
# Push this repo to GitHub, then: Actions -> Build APK -> Run workflow.
# The APK lands under "Artifacts" on the run page.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo ships lib/, test/ and pubspec.yaml only. This generates the
      # android/ host project around them without touching existing files.
      - name: Scaffold the Android host project
        run: flutter create --platforms=android --project-name dafang_ctl .

      - name: Grant network permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys, pathlib
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
          )
          if "android.permission.INTERNET" not in text:
              text = text.replace("<manifest", "<manifest", 1)
              marker = text.index(">", text.index("<manifest")) + 1
              text = text[:marker] + "\n" + perms + text[marker:]
              path.write_text(text)
              print("permissions added")
          else:
              print("permissions already present")
          PY
          cat android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Test the protocol layer
        run: flutter test

      - name: Build
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dafang-ctl-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
