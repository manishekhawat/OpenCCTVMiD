name: Build APK

# Produces an installable APK without any local toolchain.
# Actions -> Build APK -> Run workflow. The APK lands under "Artifacts".

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK at $ANDROID_SDK_ROOT with its
      # licences already accepted; android-actions/setup-android re-runs the
      # interactive licence prompt and fails on it.
      - name: Show the preinstalled Android SDK
        run: echo "$ANDROID_SDK_ROOT" && ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Protocol tests
        run: npx jest --ci

      # The repo holds src/ only. Expo generates the android/ host project,
      # wires the permissions from app.json, and autolinks react-native-udp
      # and async-storage.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the artifact
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: opencctvmid-${{ steps.name.outputs.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
