name: Build APK

# Produces an installable APK without any local toolchain, and publishes it
# to the "latest" release so it can be downloaded directly on a phone —
# Actions artifacts need a login and arrive as a .zip Android can't install.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write # required to create/replace the release

# Pushes close together used to build in parallel, and whichever finished
# last replaced the "latest" release — on 2026-11-12 an older commit's
# slower run overwrote the newer APK. A newer push now cancels older runs.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK at $ANDROID_SDK_ROOT with its
      # licences already accepted; android-actions/setup-android re-runs the
      # interactive licence prompt and fails on it.
      - name: Show the preinstalled Android SDK
        run: echo "$ANDROID_SDK_ROOT" && ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Protocol tests
        run: npx jest --ci

      # The repo holds src/ only. Expo generates the android/ host project,
      # wires the permissions from app.json, and autolinks react-native-udp
      # and async-storage.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # The wrapper fetches the Gradle distribution from services.gradle.org on
      # first run, and that has returned 504 mid-build. Retry rather than fail
      # the whole job on someone else's outage.
      - name: Build
        run: |
          cd android
          chmod +x gradlew

          # The wrapper downloads its Gradle distribution from
          # services.gradle.org on first run. That host has returned 504s and
          # read timeouts for extended stretches, failing the job before any
          # of our code compiles. Try the wrapper, then fall back to the
          # Gradle already installed on the runner, which needs no download.
          for attempt in 1 2; do
            echo "::group::Wrapper attempt $attempt"
            if ./gradlew assembleRelease --no-daemon; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            [ "$attempt" = 1 ] && { echo "retrying in 60s"; sleep 60; }
          done

          # A different Gradle version is not a fallback: the runner's 9.8.2
          # fails compiling Expo's and React Native's own Gradle plugins,
          # which are built against the 9.4.1 API. The version is fixed, so
          # the only alternative is another source for the same archive.
          PROPS=gradle/wrapper/gradle-wrapper.properties
          CURRENT=$(grep -oP 'distributionUrl=\K.*' "$PROPS" | sed 's#\\##g')
          VERSION=$(basename "$CURRENT" | sed 's/gradle-\(.*\)-bin.zip/\1/')
          MIRROR="https://downloads.gradle-dn.com/distributions/gradle-${VERSION}-bin.zip"

          echo "::group::Retrying via the CDN directly: $MIRROR"
          sed -i "s#^distributionUrl=.*#distributionUrl=$(echo "$MIRROR" | sed 's#:#\\\\:#g')#" "$PROPS"
          cat "$PROPS"
          ./gradlew assembleRelease --no-daemon && exit 0
          echo "::endgroup::"

          echo "build failed: services.gradle.org and its CDN are both unreachable"
          exit 1

      - name: Stage the APK
        id: stage
        run: |
          SHA=$(git rev-parse --short HEAD)
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$SRC" || { echo "no APK produced"; exit 1; }
          cp "$SRC" "opencctvmid-$SHA.apk"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "apk=opencctvmid-$SHA.apk" >> "$GITHUB_OUTPUT"
          ls -lh "opencctvmid-$SHA.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: opencctvmid-${{ steps.stage.outputs.sha }}
          path: ${{ steps.stage.outputs.apk }}
          if-no-files-found: error

      # A rolling "latest" release: one stable URL that always serves the most
      # recent build, so the download link never goes stale.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Belt and braces with the concurrency group: never publish a commit
          # that is no longer the branch head.
          HEAD_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $HEAD_SHA; not publishing $GITHUB_SHA"
            exit 0
          fi
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            "${{ steps.stage.outputs.apk }}" \
            --title "Latest build (${{ steps.stage.outputs.sha }})" \
            --notes "Debug-signed build of ${{ steps.stage.outputs.sha }}.

          Android will warn about installing from an unknown source — this APK
          is signed with the standard Android debug key, not a release key.

          The camera must be on the same Wi-Fi as the phone, and you need the
          device token. See the README."
